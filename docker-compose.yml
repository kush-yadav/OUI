services:
  mysql:
    image: mysql:8.4
    container_name: pg-mysql
    environment:
      MYSQL_DATABASE: pg
      MYSQL_USER: pg
      MYSQL_PASSWORD: pg
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pg-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pg-mysql:
